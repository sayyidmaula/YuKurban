<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuKurban - Sedang Offline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #FAFAF6;
            color: #10211A;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            text-align: center;
        }
        .card {
            background: #ffffff;
            border: 1px solid #E6E4D9;
            border-radius: 16px;
            padding: 2rem;
            max-width: 400px;
            box-shadow: 0 4px 12px rgba(11, 59, 44, 0.05);
        }
        .badge {
            display: inline-block;
            background: #F7EFD0;
            color: #B68A1B;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        h1 {
            color: #0B3B2C;
            font-size: 1.5rem;
            margin: 0.5rem 0 1rem;
        }
        p {
            color: #5E6E66;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .btn {
            background-color: #14704D;
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #0F5A3F;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Mode Offline</div>
        <h1>Koneksi Terputus</h1>
        <p>Anda sedang tidak terhubung ke internet. Semua transaksi tabungan dan pembelian memerlukan koneksi aktif untuk menjamin keamanan dan keakuratan ledger.</p>
        <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
    </div>
</body>
</html>
